
version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: postgresql_FinanCerto
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: finanCerto
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
       - ./init-readonly.sql:/docker-entrypoint-initdb.d/init-readonly.sql
