name: CI/CD FinCerto

on:
  push:
    branches: [ "main" ]
    paths:
      - 'back-end/finanCertoBack/**'
      - 'back-end/financerto-analytics/**'
      - 'front-end-web/**'
      - 'front-end-mobile/**'
  pull_request:
    branches: [ "main" ]

jobs:
  # --- JOB 1: JAVA ---
  test-java:
    runs-on: ubuntu-latest
    # Added more robust change verification for folder
    outputs:
      changed: ${{ steps.check_changes.outputs.java }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to compare versions

      - name: Check Java changes
        id: check_changes
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep 'back-end/finanCertoBack'; then
            echo "java=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup JDK 21
        if: steps.check_changes.outputs.java == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests (Maven)
        if: steps.check_changes.outputs.java == 'true'
        working-directory: ./back-end/finanCertoBack
        run: mvn test

  # --- JOB 2: PYTHON ---
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Simple filter: Only runs if there are changes in folder
      - name: Check Python changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python:
              - 'back-end/financerto-analytics/**'

      - name: Setup Python
        if: steps.filter.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and Test
        if: steps.filter.outputs.python == 'true'
        working-directory: ./back-end/financerto-analytics
        run: |
          pip install -r requirements.txt
          pip install pytest
          pytest

  # --- JOB 3: DEPLOY ---
  deploy:
    # Use 'always()' with conditions to ensure deploy runs if tests pass OR are skipped
    needs: [test-python, test-java]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.test-python.result == 'success' || needs.test-python.result == 'skipped') &&
      (needs.test-java.result == 'success' || needs.test-java.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Cloud via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            
            echo "========== DEPLOY DIAGNOSIS =========="
            echo "User: $(whoami)"
            echo "Home: $HOME"
            echo "PWD: $(pwd)"
            echo ""
            
            # Check Docker
            echo "=== Checking Docker ==="
            if command -v docker &> /dev/null; then
              echo "✓ Docker found: $(docker --version)"
            else
              echo "✗ CRITICAL: Docker NOT INSTALLED"
              echo "  Required action: Install Docker on Oracle Cloud"
              exit 1
            fi
            
            if command -v docker-compose &> /dev/null || docker compose --version &> /dev/null 2>&1; then
              echo "✓ Docker Compose found"
            else
              echo "✗ Docker Compose not found"
              exit 1
            fi
            echo ""
            
            # Set working directory
            DEPLOY_DIR="${HOME}/financerto"
            echo "=== Creating/Checking Deploy Directory ==="
            echo "Directory: $DEPLOY_DIR"
            
            if [ -d "$DEPLOY_DIR" ]; then
              echo "✓ Directory exists"
            else
              echo "  Creating directory..."
              mkdir -p "$DEPLOY_DIR"
              echo "✓ Directory created"
            fi
            echo ""
            
            # Clone or update repository
            echo "=== Getting Repository Code ==="
            if [ -d "$DEPLOY_DIR/.git" ]; then
              echo "  Repository exists. Updating..."
              cd "$DEPLOY_DIR"
              git pull origin main
            else
              echo "  Cloning repository..."
              cd "$HOME"
              git clone https://github.com/Arthur-MARKOWICZ/FinCerto.git financerto
              cd "$DEPLOY_DIR"
            fi
            echo "✓ Repository updated"
            echo ""
            
            # Enter directory
            echo "=== Accessing Directory ==="
            echo "✓ Current directory: $(pwd)"
            
            # Check docker-compose.yml
            if [ ! -f "docker-compose.yml" ]; then
              echo "✗ ERROR: docker-compose.yml not found in $DEPLOY_DIR"
              echo "  Files present:"
              ls -la
              exit 1
            fi
            echo "✓ docker-compose.yml found"
            echo ""
            
            # Setup environment variables
            echo "=== Setting Environment Variables ==="
            export DB_USERNAME=${{ secrets.DB_USERNAME }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export JWT_SECRET=${{ secrets.JWT_SECRET }}
            echo "✓ Environment variables configured"
            echo ""
            
            # Deploy
            echo "=== Cleaning Previous Docker Environment (Preserving Data) ==="
            # For containers without removing data volumes
            docker-compose down --remove-orphans || true
            docker-compose rm -f || true
            
            # Remove only orphaned images, but preserve data volumes
            docker system prune -f || true
            docker image prune -f || true
            
            echo "✓ Docker environment cleaned (volumes preserved)"
            echo ""
            
            echo "=== Starting Deploy with Docker Compose ==="
            # Build without cache only if necessary
            docker-compose build
            docker-compose up -d --force-recreate
            
            echo ""
            echo "========== ✓ DEPLOY COMPLETED SUCCESSFULLY =========="
            echo "Running containers:"
            docker-compose ps