name: CI/CD Financerto Professional

on:
  push:
    branches: [ "main" ]
    paths:
      - 'back-end/finanCertoBack/**'
      - 'back-end/financerto-analytics/**'
      - 'front-end/**'
  pull_request:
    branches: [ "main" ]

jobs:
  # --- JOB 1: JAVA ---
  test-java:
    runs-on: ubuntu-latest
    # Adicionamos uma verificação mais robusta para mudanças na pasta
    outputs:
      changed: ${{ steps.check_changes.outputs.java }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para comparar versões

      - name: Verificar mudanças no Java
        id: check_changes
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep 'back-end/finanCertoBack'; then
            echo "java=true" >> $GITHUB_OUTPUT
          fi

      - name: Configurar JDK 21
        if: steps.check_changes.outputs.java == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Executar Testes (Maven)
        if: steps.check_changes.outputs.java == 'true'
        working-directory: ./back-end/finanCertoBack
        run: mvn test

  # --- JOB 2: PYTHON ---
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Filtro simples: Só roda se houver mudança na pasta
      - name: Verificar mudanças no Python
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python:
              - 'back-end/financerto-analytics/**'

      - name: Configurar Python
        if: steps.filter.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar e Testar
        if: steps.filter.outputs.python == 'true'
        working-directory: ./back-end/financerto-analytics
        run: |
          pip install -r requirements.txt
          pip install pytest
          pytest

  # --- JOB 3: DEPLOY ---
  deploy:
    # Use 'always()' com condições para garantir que o deploy rode se os testes passarem OU forem pulados
    needs: [test-python, test-java]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.test-python.result == 'success' || needs.test-python.result == 'skipped') &&
      (needs.test-java.result == 'success' || needs.test-java.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy na Oracle Cloud via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            
            echo "========== DIAGNÓSTICO DO DEPLOY =========="
            echo "User: $(whoami)"
            echo "Home: $HOME"
            echo "PWD: $(pwd)"
            echo ""
            
            # Verificar Docker
            echo "=== Verificando Docker ==="
            if command -v docker &> /dev/null; then
              echo "✓ Docker encontrado: $(docker --version)"
            else
              echo "✗ CRÍTICO: Docker NÃO ESTÁ INSTALADO"
              echo "  Action necessária: Instale Docker no Oracle Cloud"
              exit 1
            fi
            
            if command -v docker-compose &> /dev/null || docker compose --version &> /dev/null 2>&1; then
              echo "✓ Docker Compose encontrado"
            else
              echo "✗ Docker Compose não encontrado"
              exit 1
            fi
            echo ""
            
            # Definir diretório de trabalho
            DEPLOY_DIR="${HOME}/financerto"
            echo "=== Criando/Verificando Diretório de Deploy ==="
            echo "Diretório: $DEPLOY_DIR"
            
            if [ -d "$DEPLOY_DIR" ]; then
              echo "✓ Diretório existe"
            else
              echo "  Criando diretório..."
              mkdir -p "$DEPLOY_DIR"
              echo "✓ Diretório criado"
            fi
            echo ""
            
            # Clone ou atualiza repositório
            echo "=== Obtendo código do repositório ==="
            if [ -d "$DEPLOY_DIR/.git" ]; then
              echo "  Repositório já existe. Atualizando..."
              cd "$DEPLOY_DIR"
              git pull origin main
            else
              echo "  Clonando repositório..."
              cd "$HOME"
              git clone https://github.com/Arthur-MARKOWICZ/FinCerto.git financerto
              cd "$DEPLOY_DIR"
            fi
            echo "✓ Repositório atualizado"
            echo ""
            
            # Entrar no diretório
            echo "=== Acessando Diretório ==="
            echo "✓ Diretório atual: $(pwd)"
            
            # Verificar docker-compose.yml
            if [ ! -f "docker-compose.yml" ]; then
              echo "✗ ERRO: docker-compose.yml não encontrado em $DEPLOY_DIR"
              echo "  Arquivos presentes:"
              ls -la
              exit 1
            fi
            echo "✓ docker-compose.yml encontrado"
            echo ""
            
            # Configurar variáveis de ambiente
            echo "=== Configurando Variáveis de Ambiente ==="
            export DB_USERNAME=${{ secrets.DB_USERNAME }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export JWT_SECRET=${{ secrets.JWT_SECRET }}
            echo "✓ Variáveis de ambiente configuradas"
            echo ""
            
            # Deploy
            echo "=== Limpando Ambiente Docker Anterior (Preservando Dados) ==="
            # Para containers sem remover volumes de dados
            docker-compose down --remove-orphans || true
            docker-compose rm -f || true
            
            # Remove apenas imagens órfãs, mas preserva volumes com dados
            docker system prune -f || true
            docker image prune -f || true
            
            echo "✓ Ambiente Docker limpo (volumes preservados)"
            echo ""
            
            echo "=== Iniciando Deploy com Docker Compose ==="
            # Build sem cache apenas se necessário
            docker-compose build
            docker-compose up -d --force-recreate
            
            echo ""
            echo "========== ✓ DEPLOY FINALIZADO COM SUCESSO =========="
            echo "Containers rodando:"
            docker-compose ps