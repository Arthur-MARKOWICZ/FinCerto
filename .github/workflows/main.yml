name: CI/CD Financerto Professional

on:
  push:
    branches: [ "main" ]
    paths:
      - 'back-end/finanCertoBack/**'
      - 'back-end/financerto-analytics/**'
      - 'front-end/**'
  pull_request:
    branches: [ "main" ]

jobs:
  # --- JOB 1: JAVA ---
  test-java:
    runs-on: ubuntu-latest
    # Adicionamos uma verificação mais robusta para mudanças na pasta
    outputs:
      changed: ${{ steps.check_changes.outputs.java }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para comparar versões

      - name: Verificar mudanças no Java
        id: check_changes
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep 'back-end/finanCertoBack'; then
            echo "java=true" >> $GITHUB_OUTPUT
          fi

      - name: Configurar JDK 21
        if: steps.check_changes.outputs.java == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Executar Testes (Maven)
        if: steps.check_changes.outputs.java == 'true'
        working-directory: ./back-end/finanCertoBack
        run: mvn test

  # --- JOB 2: PYTHON ---
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Filtro simples: Só roda se houver mudança na pasta
      - name: Verificar mudanças no Python
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python:
              - 'back-end/financerto-analytics/**'

      - name: Configurar Python
        if: steps.filter.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar e Testar
        if: steps.filter.outputs.python == 'true'
        working-directory: ./back-end/financerto-analytics
        run: |
          pip install -r requirements.txt
          pip install pytest
          pytest

  # --- JOB 3: DEPLOY ---
  deploy:
    # Use 'always()' com condições para garantir que o deploy rode se os testes passarem OU forem pulados
    needs: [test-python, test-java]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.test-python.result == 'success' || needs.test-python.result == 'skipped') &&
      (needs.test-java.result == 'success' || needs.test-java.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy na Oracle Cloud via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            
            # Diagnóstico: Verificar ambiente
            echo "=== Diagnóstico do Environment ==="
            whoami
            pwd
            echo "Docker version:"
            docker --version || echo "Docker not found in PATH"
            echo "Docker compose version:"
            docker compose --version || docker-compose --version || echo "Docker compose not found"
            echo ""
            
            # Tentar entrar no diretório
            echo "=== Tentando acessar diretório ==="
            if [ -d "/home/opc/financerto" ]; then
              echo "Diretório /home/opc/financerto existe"
              ls -la /home/opc/financerto || echo "Sem permissão de leitura"
            else
              echo "Diretório /home/opc/financerto NÃO existe. Criando..."
              mkdir -p /home/opc/financerto
            fi
            
            # Mudar para o diretório com tratamento de erro
            echo "=== Entrando no diretório ==="
            if ! cd /home/opc/financerto; then
              echo "ERRO: Não foi possível entrar em /home/opc/financerto"
              echo "Tentando com sudo..."
              sudo -u opc bash -c "cd /home/opc/financerto && pwd" || exit 1
            fi
            
            # Configurar variáveis de ambiente
            export DB_USERNAME=${{ secrets.DB_USERNAME }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export JWT_SECRET=${{ secrets.JWT_SECRET }}
            
            # Deploy com docker compose
            echo "=== Iniciando Deploy ==="
            docker compose pull || docker-compose pull
            docker compose up -d || docker-compose up -d
            
            echo "Deploy do Financerto finalizado com sucesso!"