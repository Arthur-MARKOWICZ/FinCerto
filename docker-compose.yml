version: "3.8"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: finanCerto
    ports:
      - "5432:5432"
    networks:
      - financerto-net

  financerto-app:
    build: ./back-end/finanCertoBack
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finanCerto
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: minhaChaveSecretaSuperSegura123456789012345678901234567890
      FASTAPI_BASE_URL: http://financerto-fastapi:8001/api
    ports:
      - "8080:8080"
    networks:
      - financerto-net

  financerto-fastapi:
    build: ./back-end/financerto-analytics
    environment:
      DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/finanCerto
    ports:
      - "8001:8001"
    networks:
      - financerto-net

networks:
  financerto-net:
