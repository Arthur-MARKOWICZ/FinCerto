[pytest]
# Configuração do pytest para FinanCerto Analytics
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
markers =
    asyncio: marca testes que usam async/await
    integration: marca testes de integração
    unit: marca testes unitários
    slow: marca testes que demoram mais tempo
