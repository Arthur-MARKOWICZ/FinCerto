# Configurações específicas para testes de Categoria
# Override BaseIntegrationTest se necessário

# Força limpeza completa do schema H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

# Desabilita constraints para evitar problemas de FK em testes
spring.jpa.properties.hibernate.hbm2ddl.auto=create-drop
spring.jpa.properties.hibernate.check_nullability=true

# JWT dummy values for tests
jwt.secret=test-secret
jwt.expiration=86400000
