spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finanCerto
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

fastapi:
  base-url: ${FAST_API_URL:http://localhost:8001/api}
